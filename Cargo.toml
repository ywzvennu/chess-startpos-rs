[package]
name = "chess-startpos-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ywzvennu"]
description = "Generate, count, and sample chess back-rank arrangements under composable constraints (Chess960, Chess2880, custom presets)"
repository = "https://github.com/ywzvennu/chess-startpos-rs"
homepage = "https://github.com/ywzvennu/chess-startpos-rs"
documentation = "https://docs.rs/chess-startpos-rs"
readme = "README.md"
keywords = ["chess", "chess960", "fischer", "csp", "combinatorics"]
categories = ["game-development"]
exclude = [
    ".github/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Derive `serde::{Serialize, Deserialize}` on `Constraint`, `CountOp`,
# `SquareColor`, `Problem`, `ValidationError`, and `chess::Piece`.
serde = ["dep:serde"]

[dependencies]
fastrand = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "presets"
harness = false
